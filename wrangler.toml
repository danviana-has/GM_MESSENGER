name = "gm-messenger"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Define a pasta public como diretório de assets/arquivos estáticos
assets = { directory = "./public" }

# Vinculação com o Cloudflare KV (Substitua o ID pelo ID do seu namespace no painel da Cloudflare)
[[kv_namespaces]]
binding = "OTP_STORE"
id = "COLE_O_ID_DO_SEU_KV_AQUI"
